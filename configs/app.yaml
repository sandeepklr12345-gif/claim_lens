seed: 42

llm:
  host: http://localhost:11434   # override with OLLAMA_HOST
  model: qwen2.5:7b              # override with OLLAMA_MODEL

rag:
  embed_model: BAAI/bge-small-en-v1.5
  chunk_min_words: 100
  chunk_max_words: 300
  top_k_fused: 10
  top_k_return: 3
  rrf_k: 60

matcher:
  model: models/matcher_v2   # git-ignored; build with eval.train_matcher (see README)
  fallback_model: cross-encoder/ms-marco-MiniLM-L-6-v2   # used when a models/ checkpoint is absent

agent:
  tau_high: 0.96   # SUPPORTED if match prob >= tau_high (tuned on validation cases, see eval/results/tau.json)
  tau_low: 0.82    # NOT_SUPPORTED if match prob < tau_low; otherwise INSUFFICIENT_EVIDENCE
  tau_aas: 0.4     # reflect while AAS < this (tuned on validation, see eval/results/reflection_v2.md)
  max_rounds: 2
