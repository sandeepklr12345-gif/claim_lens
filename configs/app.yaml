seed: 42

llm:
  host: http://localhost:11434   # override with OLLAMA_HOST
  model: qwen2.5:7b              # override with OLLAMA_MODEL

rag:
  embed_model: BAAI/bge-small-en-v1.5
  chunk_min_words: 100
  chunk_max_words: 300
  top_k_fused: 10
  top_k_return: 3
  rrf_k: 60

matcher:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

agent:
  tau_high: 0.7    # SUPPORTED if match prob >= tau_high (SPEC 7.6; tuned on first 10 cases in M3)
  tau_low: 0.3     # NOT_SUPPORTED if match prob < tau_low; otherwise INSUFFICIENT_EVIDENCE
  tau_aas: 0.6     # reflect while AAS < this
  max_rounds: 2
