name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel an older run of the same branch when a newer push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the repository
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: "Install CI dependencies (light, no torch, no models)"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check .

      # Tests marked @pytest.mark.model need torch, a Hugging Face model,
      # Ollama or a GPU. They run locally with: pytest -q -m model
      - name: Unit tests with coverage
        run: pytest -q -m "not model" --cov=claimlens --cov=api --cov-report=term

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t claimlens:ci .
